<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delphi AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f9;
        }

        .chat {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #0176d3;
            color: white;
            padding: 16px;
            font-weight: bold;
        }

        .messages {
            padding: 20px;
            min-height: 250px;
        }

        .assistant {
            background: #eef4ff;
            padding: 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .input {
            border-top: 1px solid #ddd;
            padding: 16px;
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 18px;
            background: #0176d3;
            border: 0;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat">

    <div class="header">
        Delphi AI Assistant
    </div>

    <div class="messages">
        <div class="assistant">
            Hello! I'm an external application running outside Salesforce.
        </div>
    </div>

    <div class="input">
        <input type="text" placeholder="Ask me something...">
        <button>Send</button>
    </div>

</div>

</body>
</html>
